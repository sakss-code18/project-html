<!DOCTYPE html>

<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/jpg" href="images/icon.jpg" />
</head>

<body>
<!-- HEADER -->
<header>
<h2>My Portfolio</h2>
<nav>
<a href="#hero">Home</a>

<script src="js/main.js"></script>
